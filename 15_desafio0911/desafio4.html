<button id="adicionar">adicionar +1</button>
<button id="zerar">zerar</button>
<h2 id="contador">0</h2>

<script>
    let contador = 0;

    const btadd = document.querySelector("#adicionar");
    const btlimpar = document.querySelector("#zerar");
    const retorno = document.querySelector("#contador");

    btadd.addEventListener("click", ()=> {
        contador ++
        retorno.textContent = contador
    });

    btlimpar.addEventListener("click", ()=> {
        contador = 0
        retorno.textContent = 0
    })
</script>
